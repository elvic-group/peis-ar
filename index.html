<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peisen i 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg:#141414; --fg:#f3efe9; --muted:#a9a39b; --accent:#e8742c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { display:flex; flex-direction:column; height:100%; }
  header { padding:20px 16px 0; text-align:center; }
  h1 { margin:0; font-size:1.4rem; font-weight:600; letter-spacing:.01em; }
  p { margin:6px 0 0; color:var(--muted); font-size:.95rem; }
  model-viewer { flex:1; width:100%; min-height:60vh; background:radial-gradient(circle at 50% 55%, #2a2522 0%, var(--bg) 70%);
    --poster-color: transparent; }
  .ar-btn { position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--accent); color:#fff; border:0; border-radius:999px; padding:14px 24px;
    font-size:1rem; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.4); cursor:pointer; }
  footer { padding:10px 16px 18px; text-align:center; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Peisen i 3D</h1>
    <p>Dra for å snu, klyp for å zoome. Trykk knappen for å se den i rommet ditt.</p>
  </header>
  <model-viewer src="peis_fire2.glb" ios-src="peis_fire2.usdz" autoplay poster="thumbnail.png"
      alt="3D-modell av en hengende sylinderpeis i mørkt stål"
      ar ar-modes="scene-viewer quick-look webxr" ar-scale="auto" ar-placement="floor"
      camera-controls touch-action="pan-y" auto-rotate rotation-per-second="20deg"
      shadow-intensity="1" exposure="1.05" environment-image="neutral">
    <button slot="ar-button" class="ar-btn">Se i ditt rom</button>
  </model-viewer>
  <p id="ar-fallback" hidden style="text-align:center;padding:0 16px">
    Startet ikke AR? <a id="sv-link" style="color:var(--accent)">Åpne i Google Scene Viewer</a>
    (krever Google-appen og «Google Play Services for AR»).
  </p>
  <footer>Fungerer på iPhone (AR Quick Look) og Android (Scene Viewer).</footer>
</main>
<script>
  // Android fallback: direct Scene Viewer intent if model-viewer's AR launch fails.
  const glb = new URL("peis_fire2.glb", location.href).href;
  const intent = "intent://arvr.google.com/scene-viewer/1.0?file=" + encodeURIComponent(glb) +
    "&mode=ar_preferred&title=" + encodeURIComponent("Peisen") +
    "#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;" +
    "S.browser_fallback_url=" + encodeURIComponent("https://play.google.com/store/apps/details?id=com.google.ar.core") + ";end;";
  document.getElementById("sv-link").href = intent;
  const mv = document.querySelector("model-viewer");
  mv.addEventListener("ar-status", e => {
    if (e.detail.status === "failed") document.getElementById("ar-fallback").hidden = false;
  });
  if (/Android/i.test(navigator.userAgent)) document.getElementById("ar-fallback").hidden = false;
</script>
</body>
</html>
